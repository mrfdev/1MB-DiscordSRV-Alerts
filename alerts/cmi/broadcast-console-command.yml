# Alert-ID: cmi/broadcast-console-command
# Description: Mirrors a CMI broadcast issued from the server console to Discord.
# Plugin: CMI
# Alert-Version: 3.0.0
# Alert-Build: 003
# Status: verified
# Authors: mrfloris
# Credit: Zrips
# Origin-URL: https://github.com/mrfdev/CMI/blob/master/Resources/Add-ons/discordsrv/alert%20-%20cmi%20broadcast%20-%20console%20broadcast%20event.yml
# Origin-Version: 0.3.0
# Origin-Build: 034
# License: GPL-3.0-or-later
# Audience: player
# Channel: global
# Verified-DiscordSRV: 1.30.5
# Verified-Paper: 26.2-120
# Verified-Java: 25
# Required-Plugin: CMI 9.8.9.9
# Verified-Date: 2026-08-29

Alerts:
  - Trigger: org.bukkit.event.server.ServerCommandEvent
    Async: false
    Conditions:
      - '#command != null and #command.toLowerCase().startsWith("cmi broadcast ")'
      - '#command.split(" ", 3).length > 2 and !#command.split(" ", 3)[2].trim().isEmpty()'
    Channel: global
    IgnoreCancelled: false
    Content: ""
    Webhook:
      Enabled: false
    Embed:
      Enabled: true
      Color: "#000001"
      Author:
        ImageUrl: "{botavatarurl}"
        Name: "Broadcast"
        Url: ""
      Description: |
        `CONSOLE posted:`
        ```md
        # ${#command.split(" ", 3)[2]}
        ```
      Timestamp: true
