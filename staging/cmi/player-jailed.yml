# Alert-ID: cmi/player-jailed
# Description: Logs when CMI places a player into a jail cell.
# Plugin: CMI
# Alert-Version: 3.0.0
# Alert-Build: 002
# Status: candidate
# Authors: mrfloris
# Credit: hyper_toxic @ dynamiccraft
# Credit: Zrips
# Origin-URL: https://github.com/mrfdev/CMI/blob/master/Resources/Add-ons/discordsrv/alert%20-%20cmi%20jail%20-%20jail%20user%20event.yml
# Origin-Version: 0.3.0
# Origin-Build: 034
# License: GPL-3.0-or-later
# Audience: logs
# Channel: logs
# Verified-DiscordSRV: unverified
# Verified-Paper: unverified
# Verified-Java: unverified
# Required-Plugin: CMI 9.8.9.9
# Verified-Date: unverified

Alerts:
  - Trigger: com.Zrips.CMI.events.CMIPlayerJailEvent
    Async: false
    Conditions: []
    Channel: logs
    IgnoreCancelled: true
    Content: ""
    Webhook:
      Enabled: false
    Embed:
      Enabled: true
      Color: "#ff9900"
      Title:
        Text: "Player jailed"
        Url: ""
      Fields:
        - "Player:;`${#event.getUser().getName()}`;true"
        - "Jail:;`${#event.getCell().getJail().getName()}`;true"
        - "Cell:;`${#event.getCell().getId()}`;true"
      Timestamp: true
