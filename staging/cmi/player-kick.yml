# Alert-ID: cmi/player-kick
# Description: Logs a CMI player kick with actor and reason.
# Plugin: CMI
# Alert-Version: 3.0.0
# Alert-Build: 001
# Status: candidate
# Authors: mrfloris
# Credit: boredmanplays
# Credit: Zrips
# Origin-URL: https://github.com/mrfdev/CMI/blob/master/Resources/Add-ons/discordsrv/alert%20-%20cmi%20kick%20-%20user%20kick%20event.yml
# Origin-Version: 0.3.0
# Origin-Build: 034
# License: GPL-3.0-or-later
# Audience: logs
# Channel: logs
# Verified-DiscordSRV: unverified
# Verified-Paper: unverified
# Verified-Java: unverified
# Required-Plugin: CMI 9.8.9.9
# Verified-Date: unverified

Alerts:
  - Trigger: com.Zrips.CMI.events.CMIPlayerKickEvent
    Async: false
    Conditions: []
    Channel: logs
    IgnoreCancelled: true
    Content: ""
    Webhook:
      Enabled: false
    Embed:
      Enabled: true
      Color: "#ff4747"
      Author:
        ImageUrl: "https://crafatar.com/avatars/${#event.getBanned()}?overlay"
        Name: "Player kicked"
        Url: ""
      Description: |
        `${#event.getBannedBy()?.getName() ?: 'Console'}` kicked **${T(org.bukkit.Bukkit).getOfflinePlayer(#event.getBanned()).getName() ?: 'Unknown'}** (`${#event.getBanned()}`).
        **Reason:** `${#event.getReason() ?: 'None provided'}`
      Timestamp: true
