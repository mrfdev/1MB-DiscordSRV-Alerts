name: Publish catalog site

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "alerts/**"
      - "screenshots/**"
      - "site/**"
      - "src/**"
      - "collection.yml"
      - "package.json"
      - "package-lock.json"
      - "vite.config.ts"
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build catalog
        run: npm run site:build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
